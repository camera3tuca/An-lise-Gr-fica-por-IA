<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <defs>
    <style>
      .brand-science {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .brand-computer {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.38em;
      }
    </style>
  </defs>

  <!-- ScienceBit Main Text -->
  <text x="180" y="48" text-anchor="middle" class="brand-science">
    <tspan fill="#FFFFFF">Science</tspan><tspan fill="#0066FF">Bit</tspan>
  </text>

  <!-- Left Accent Line -->
  <line x1="38" y1="72" x2="105" y2="72" stroke="#0066FF" stroke-width="3" stroke-linecap="round"/>

  <!-- COMPUTER Centered Text -->
  <text x="182" y="76" text-anchor="middle" class="brand-computer" fill="#CBD5E1">
    COMPUTER
  </text>

  <!-- Right Accent Line -->
  <line x1="255" y1="72" x2="322" y2="72" stroke="#0066FF" stroke-width="3" stroke-linecap="round"/>
</svg>
