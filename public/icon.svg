<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e" />
      <stop offset="50%" stop-color="#14201a" />
      <stop offset="100%" stop-color="#08100c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E6A0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00B37E" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#22332B" stroke-width="4" opacity="0.6" />

  <!-- Technical Candlesticks -->
  <!-- Candle 1: Bullish small -->
  <line x1="120" y1="210" x2="120" y2="340" stroke="#00E6A0" stroke-width="6" stroke-linecap="round" />
  <rect x="100" y="240" width="40" height="70" rx="6" fill="#00E6A0" />

  <!-- Candle 2: Bearish -->
  <line x1="190" y1="190" x2="190" y2="360" stroke="#FF5A5A" stroke-width="6" stroke-linecap="round" />
  <rect x="170" y="220" width="40" height="85" rx="6" fill="#FF5A5A" />

  <!-- Candle 3: Bullish strong -->
  <line x1="260" y1="130" x2="260" y2="320" stroke="#00E6A0" stroke-width="6" stroke-linecap="round" />
  <rect x="240" y="160" width="40" height="110" rx="6" fill="#00E6A0" />

  <!-- Candle 4: Bullish higher -->
  <line x1="330" y1="110" x2="330" y2="290" stroke="#00E6A0" stroke-width="6" stroke-linecap="round" />
  <rect x="310" y="130" width="40" height="90" rx="6" fill="#00E6A0" />

  <!-- AI Trend Vector Curve -->
  <path d="M 80 340 Q 180 290 260 210 T 430 110" fill="none" stroke="#00E6A0" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- AI Sparkle Node at peak -->
  <circle cx="430" cy="110" r="14" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="430" cy="110" r="8" fill="#00E6A0" />

  <!-- Mini sparkles -->
  <polygon points="400,90 404,98 412,102 404,106 400,114 396,106 388,102 396,98" fill="#00E6A0" opacity="0.9" />
  
  <!-- Badge Pill at Bottom -->
  <rect x="146" y="395" width="220" height="42" rx="21" fill="#14241D" stroke="#2A4035" stroke-width="2" />
  <text x="256" y="422" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#00E6A0" letter-spacing="3">CHART AI</text>
</svg>
